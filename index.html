<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RetailShift Analytics</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
font-family: system-ui, -apple-system, sans-serif;
background-color: #0f172a;
color: #f8fafc;
padding: 24px;
}
.container { max-width: 1160px; margin: 0 auto; }
header {
display: flex;
flex-wrap: wrap;
justify-content: space-between;
align-items: center;
gap: 16px;
margin-bottom: 24px;
}
h1 { font-size: 1.6rem; }
.subtitle { color: #94a3b8; font-size: 0.9rem; margin-top: 4px; }
.filters {
display: flex;
gap: 8px;
background: #1e293b;
padding: 6px;
border-radius: 10px;
}
.filters button {
border: none;
background: transparent;
color: #cbd5e1;
padding: 8px 14px;
border-radius: 8px;
cursor: pointer;
font-weight: 600;
}
.filters button.active {
background: #3b82f6;
color: #ffffff;
}
.grid-4 {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
gap: 16px;
margin-bottom: 24px;
}
.grid-2 {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
gap: 16px;
margin-bottom: 24px;
}
.card {
background: #1e293b;
border: 1px solid #334155;
border-radius: 12px;
padding: 18px;
}
.card-title { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 8px; }
.card-value { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
.card-sub { font-size: 0.82rem; color: #94a3b8; }
.section-title { font-size: 1.1rem; margin-bottom: 14px; }
.bars {
display: flex;
align-items: flex-end;
gap: 8px;
height: 170px;
padding-top: 20px;
}
.bar-col {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: flex-end;
height: 100%;
gap: 6px;
}
.bar {
width: 100%;
background: #3b82f6;
border-radius: 6px 6px 0 0;
}
.bar-label { font-size: 0.7rem; color: #cbd5e1; }
.bar-val { font-size: 0.68rem; color: #94a3b8; }
.log-item {
display: flex;
justify-content: space-between;
align-items: center;
background: #0f172a;
padding: 10px 12px;
border-radius: 8px;
margin-top: 10px;
}
.camp-item { margin-top: 12px; }
.camp-top {
display: flex;
justify-content: space-between;
font-size: 0.88rem;
margin-bottom: 5px;
}
.progress-bg {
width: 100%;
height: 8px;
background: #0f172a;
border-radius: 999px;
overflow: hidden;
}
.progress-fill { height: 100%; background: #38bdf8; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #334155; }
th { color: #94a3b8; font-weight: 600; }
.good { color: #4ade80; font-weight: 700; }
.warn { color: #fbbf24; font-weight: 700; }
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
const formatBRL = (v) =>
v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

const storeDataByShift = {
All: {
todaySales: 16420,
monthSales: 248300,
monthlyTarget: 450000,
delightScore: 93.4,
reviews: 312,
bundles: 14,
daily: [12, 14, 13, 16, 15, 18, 17, 15, 14, 19, 17, 16, 15, 18, 16.4],
pickups: [
{ date: "Nov 18 (Tue)", bundles: 12, status: "Completed" },
{ date: "Nov 15 (Fri)", bundles: 15, status: "Completed" },
{ date: "Nov 22 (Fri)", bundles: 14, status: "Scheduled" }
],
campaigns: [
{ name: "Vitamin C Effervescent 30ct", sold: 145, target: 160 },
{ name: "SPF 70 Facial Sunscreen", sold: 190, target: 180 },
{ name: "Hydrating Sensitive Skin Lotion", sold: 95, target: 140 }
],
staff: [
{ name: "Ana Paula Silva", role: "Shift Supervisor", shift: "Morning", reviews: 64, score: 96.2 },
{ name: "Carlos Eduardo Souza", role: "Pharmacy Attendant", shift: "Afternoon", reviews: 52, score: 91.8 },
{ name: "Mariana Oliveira", role: "Pharmacy Attendant", shift: "Night", reviews: 48, score: 94.5 }
]
},
Morning: {
todaySales: 6200,
monthSales: 94500,
monthlyTarget: 170000,
delightScore: 94.8,
reviews: 118,
bundles: 5,
daily: [5.2, 6.0, 5.8, 6.4, 5.9, 6.8, 6.5, 6.1, 5.7, 7.1, 6.4, 6.0, 5.8, 6.6, 6.2],
pickups: [
{ date: "Nov 18 (Tue)", bundles: 5, status: "Completed" },
{ date: "Nov 22 (Fri)", bundles: 5, status: "Scheduled" }
],
campaigns: [
{ name: "Vitamin C Effervescent 30ct", sold: 62, target: 65 },
{ name: "SPF 70 Facial Sunscreen", sold: 74, target: 70 },
{ name: "Hydrating Sensitive Skin Lotion", sold: 40, target: 55 }
],
staff: [
{ name: "Ana Paula Silva", role: "Shift Supervisor", shift: "Morning", reviews: 64, score: 96.2 },
{ name: "Lucas Ferreira", role: "Pharmacy Attendant", shift: "Morning", reviews: 54, score: 93.4 }
]
},
Afternoon: {
todaySales: 6520,
monthSales: 98200,
monthlyTarget: 175000,
delightScore: 91.8,
reviews: 112,
bundles: 6,
daily: [5.0, 5.6, 5.2, 6.7, 6.2, 7.2, 6.9, 6.0, 5.8, 7.5, 6.8, 6.3, 6.0, 7.0, 6.5],
pickups: [
{ date: "Nov 18 (Tue)", bundles: 4, status: "Completed" },
{ date: "Nov 22 (Fri)", bundles: 6, status: "Scheduled" }
],
campaigns: [
{ name: "Vitamin C Effervescent 30ct", sold: 55, target: 60 },
{ name: "SPF 70 Facial Sunscreen", sold: 78, target: 72 },
{ name: "Hydrating Sensitive Skin Lotion", sold: 35, target: 50 }
],
staff: [
{ name: "Carlos Eduardo Souza", role: "Pharmacy Attendant", shift: "Afternoon", reviews: 52, score: 91.8 },
{ name: "Beatriz Santos", role: "Pharmacy Attendant", shift: "Afternoon", reviews: 60, score: 91.8 }
]
},
Night: {
todaySales: 3700,
monthSales: 55600,
monthlyTarget: 105000,
delightScore: 93.9,
reviews: 82,
bundles: 3,
daily: [2.8, 3.1, 3.0, 3.5, 3.4, 4.0, 3.8, 3.4, 3.1, 4.4, 3.8, 3.7, 3.2, 4.4, 3.7],
pickups: [
{ date: "Nov 18 (Tue)", bundles: 3, status: "Completed" },
{ date: "Nov 22 (Fri)", bundles: 3, status: "Scheduled" }
],
campaigns: [
{ name: "Vitamin C Effervescent 30ct", sold: 28, target: 35 },
{ name: "SPF 70 Facial Sunscreen", sold: 38, target: 38 },
{ name: "Hydrating Sensitive Skin Lotion", sold: 20, target: 35 }
],
staff: [
{ name: "Mariana Oliveira", role: "Pharmacy Attendant", shift: "Night", reviews: 48, score: 94.5 },
{ name: "Rafael Almeida", role: "Night Supervisor", shift: "Night", reviews: 34, score: 93.3 }
]
}
};

let currentShift = "All";

function render() {
const d = storeDataByShift[currentShift];
const progressPct = Math.min(100, Math.round((d.monthSales / d.monthlyTarget) * 100));
const maxBar = Math.max(...d.daily);

document.getElementById("app").innerHTML = `
<header>
<div>
<h1>RetailShift Analytics</h1>
<p class="subtitle">Store #042 — Shift Operations, Safe Cash, Campaigns & Customer Delight</p>
</div>
<div class="filters">
${["All", "Morning", "Afternoon", "Night"].map((s) => `
<button class="${currentShift === s ? "active" : ""}" onclick="setShift('${s}')">
${s === "Night" ? "Night (Madrugada)" : s}
</button>
`).join("")}
</div>
</header>

<section class="grid-4">
<div class="card">
<div class="card-title">Today's Sales</div>
<div class="card-value">${formatBRL(d.todaySales)}</div>
<div class="card-sub">Shift: ${currentShift}</div>
</div>
<div class="card">
<div class="card-title">Monthly Target Progress</div>
<div class="card-value">${progressPct}%</div>
<div class="card-sub">${formatBRL(d.monthSales)} / ${formatBRL(d.monthlyTarget)}</div>
</div>
<div class="card">
<div class="card-title">Customer Delight ("Encantou")</div>
<div class="card-value">${d.delightScore}%</div>
<div class="card-sub">${d.reviews} customer evaluations</div>
</div>
<div class="card">
<div class="card-title">Safe Cash Control</div>
<div class="card-value">${formatBRL(d.bundles * 1000)}</div>
<div class="card-sub">${d.bundles} bundles of R$ 1,000 in safe</div>
</div>
</section>

<section class="card" style="margin-bottom: 24px;">
<h2 class="section-title">Daily Sales Trend (R$ in thousands)</h2>
<div class="bars">
${d.daily.map((val, i) => {
const h = Math.max(14, Math.round((val / maxBar) * 100));
return `
<div class="bar-col">
<span class="bar-val">${val}k</span>
<div class="bar" style="height: ${h}%;"></div>
<span class="bar-label">${String(i + 1).padStart(2, "0")}</span>
</div>
`;
}).join("")}
</div>
</section>

<section class="grid-2">
<div class="card">
<h2 class="section-title">Safe & Armored Car Pickups (2x / week)</h2>
<p class="card-sub">Bundles in R$ 1,000 units</p>
${d.pickups.map((p) => `
<div class="log-item">
<div>
<strong>${p.date}</strong>
<div class="card-sub">${p.bundles} bundles of R$ 1,000</div>
</div>
<div style="text-align:right;">
<strong>${formatBRL(p.bundles * 1000)}</strong>
<div class="${p.status === "Completed" ? "good" : "warn"}" style="font-size:0.78rem;">${p.status}</div>
</div>
</div>
`).join("")}
</div>

<div class="card">
<h2 class="section-title">Monthly Campaign Goals</h2>
${d.campaigns.map((c) => {
const pct = Math.min(100, Math.round((c.sold / c.target) * 100));
return `
<div class="camp-item">
<div class="camp-top">
<span>${c.name}</span>
<strong>${c.sold}/${c.target} (${pct}%)</strong>
</div>
<div class="progress-bg">
<div class="progress-fill" style="width: ${pct}%;"></div>
</div>
</div>
`;
}).join("")}
</div>
</section>

<section class="card">
<h2 class="section-title">Staff Customer Delight ("Encantou")</h2>
<table>
<thead>
<tr>
<th>Employee</th>
<th>Role</th>
<th>Shift</th>
<th>Reviews</th>
<th>Delight Score</th>
</tr>
</thead>
<tbody>
${d.staff.map((st) => `
<tr>
<td><strong>${st.name}</strong></td>
<td>${st.role}</td>
<td>${st.shift}</td>
<td>${st.reviews}</td>
<td class="${st.score >= 92 ? "good" : "warn"}">${st.score}%</td>
</tr>
`).join("")}
</tbody>
</table>
</section>
`;
}

function setShift(shift) {
currentShift = shift;
render();
}

render();
</script>
</body>
</html>
